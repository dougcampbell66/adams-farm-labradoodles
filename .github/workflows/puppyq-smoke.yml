name: PuppyQ data smoke test

# Catches the "data not displaying" outage automatically: if the live site's
# PuppyQ data ever goes empty again (e.g. Supabase env vars removed on Vercel,
# or the key rotated), this fails and notifies via the Actions tab / email.
#
# Requires one repo VARIABLE (Settings → Secrets and variables → Actions →
# Variables): PUPPYQ_SITE_URL = the production URL (e.g. https://<site>.vercel.app
# or https://adamsfarmlabradoodles.com). Until it's set, the job skips cleanly.

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Skip if site URL not configured
        id: cfg
        run: |
          if [ -z "${{ vars.PUPPYQ_SITE_URL }}" ]; then
            echo "PUPPYQ_SITE_URL repo variable is not set — skipping (see STATUS.md)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke test the live PuppyQ health endpoint
        if: steps.cfg.outputs.skip != 'true'
        run: node scripts/puppyq-smoke.mjs "${{ vars.PUPPYQ_SITE_URL }}"
